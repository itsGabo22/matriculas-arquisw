# api-gateway: punto único de entrada (C4 N2). Enruta a quota-service vía JSON/HTTP.
# Propaga el correlationId del cliente o genera uno nuevo (táctica de trazabilidad U-8).
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

upstream quota_service {
    server quota-service:3000;
}

server {
    listen 8080;

    location = /gateway/health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway"}';
    }

    location / {
        proxy_pass http://quota_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
