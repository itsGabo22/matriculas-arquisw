# api-gateway: punto único de entrada (C4 N2). Enruta a quota-service vía JSON/HTTP.
# Propaga el correlationId del cliente o genera uno nuevo (táctica de trazabilidad U-8).
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

upstream quota_service {
    server quota-service:3000;
}

server {
    listen 8080;

    location = /gateway/health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway"}';
    }

    # Consola de demo (archivos estáticos). Es solo un cliente del sistema: no es un contenedor aparte.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # Solo lectura y solo para la consola de demo: estadísticas de colas de RabbitMQ.
    # No forma parte del flujo de matrícula. Credenciales guest/guest de desarrollo.
    location = /mq/queues {
        limit_except GET { deny all; }
        proxy_pass http://rabbitmq:15672/api/queues;
        proxy_set_header Authorization "Basic Z3Vlc3Q6Z3Vlc3Q=";
    }

    location / {
        proxy_pass http://quota_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
